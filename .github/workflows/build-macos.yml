name: Build macOS application

on:
  push:
    branches: [main]
    paths:
      - 'macOS/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated backup and synchronization scenarios
        working-directory: macOS
        run: |
          set -euo pipefail
          ./scripts/check.sh | tee "$RUNNER_TEMP/SafeSync-macOS-checks.txt"
          swift test --disable-sandbox | tee "$RUNNER_TEMP/SafeSync-macOS-xctests.txt"
      - name: Reproduce transient network handling without changing the application
        working-directory: macOS
        run: swift run --disable-sandbox SafeSyncChecks --network-diagnostic
      - name: Build Universal application
        working-directory: macOS
        run: ARCHITECTURE=universal ./scripts/build-app.sh
      - name: Preserve published desktop registration and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/safesync-previous"
          ditto -x -k dist/SafeSync-macOS-0.3.7-universal.zip "$previous"
          registration="$previous/SafeSync.app/Contents/Resources/GoogleDesktopOAuth.plist"
          test -f "$registration"
          cp "$registration" macOS/build/SafeSync.app/Contents/Resources/GoogleDesktopOAuth.plist
          codesign --force --deep --sign - macOS/build/SafeSync.app
          codesign --verify --deep --strict macOS/build/SafeSync.app
          plutil -lint macOS/build/SafeSync.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macOS/build/SafeSync.app/Contents/Info.plist)" = '0.3.12'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' macOS/build/SafeSync.app/Contents/Info.plist)" = '21'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' macOS/build/SafeSync.app/Contents/Info.plist)" = 'io.limfrog.SafeSync.macOS'
          test -x macOS/build/SafeSync.app/Contents/MacOS/SafeSync
          cmp "$registration" macOS/build/SafeSync.app/Contents/Resources/GoogleDesktopOAuth.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSHumanReadableCopyright' macOS/build/SafeSync.app/Contents/Info.plist)" = 'SafeSync · Horizon Entertainment'
          lipo -info macOS/build/SafeSync.app/Contents/MacOS/SafeSync
          lipo macOS/build/SafeSync.app/Contents/MacOS/SafeSync -verify_arch arm64 x86_64
          ditto -c -k --sequesterRsrc --keepParent macOS/build/SafeSync.app "$RUNNER_TEMP/SafeSync-macOS-0.3.12-universal.zip"
          unzip -t "$RUNNER_TEMP/SafeSync-macOS-0.3.12-universal.zip"
          shasum -a 256 "$RUNNER_TEMP/SafeSync-macOS-0.3.12-universal.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SafeSync-macOS-0.3.12-universal
          path: |
            ${{ runner.temp }}/SafeSync-macOS-0.3.12-universal.zip
            ${{ runner.temp }}/SafeSync-macOS-checks.txt
            ${{ runner.temp }}/SafeSync-macOS-xctests.txt
          retention-days: 7
